st 12`,detail:`15 is the only number bigger than 12.`}],rightFeedback:`Yes! 15 is greater than 12.`}]},{id:`reading-1`,subject:`reading`,grade:1,topic:`Story details and short words`,questions:[{id:`r1q1`,skill:`Finding a detail in a story`,prompt:`What color is Sam's hat?`,choices:[`Red`,`Blue`,`Green`,`Yellow`],answerIndex:0,hints:[`Close. Go back to the story and look at the sentence about Sam's hat.`,`The story says Sam 'put on his red hat.' Which color is that?`],nudge:`You're close. Reread the sentence that talks about the hat.`,steps:[{title:`Find the hat sentence`,detail:`Look for the word 'hat' in the story.`},{title:`Read the color word`,detail:`It says Sam put on his red hat.`},{title:`That's the answer`,detail:`The hat is red.`}],rightFeedback:`Exactly! The hat is red.`,passage:`Sam got ready to go outside. He put on his red hat and his warm coat. Then he opened the door and felt the cold air on his nose. Sam smiled and ran out to play in the snow.`},{id:`r1q2`,skill:`Understanding why a character feels something`,prompt:`Why is Sam smiling?`,choices:[`He is cold`,`He is going to play in the snow`,`He lost his hat`,`He is sleepy`],answerIndex:1,hints:[`Close. Think about what Sam is doing right after he smiles.`,`Right after he smiles, the story says Sam 'ran out to play in the snow.' That's why he is happy.`],nudge:`You're close. What does Sam do right after he smiles?`,steps:[{title:`Find the smile`,detail:`The story says Sam smiled at the end.`},{title:`Look at what happens next`,detail:`He ran out to play in the snow.`},{title:`That's the answer`,detail:`He is smiling because he gets to play in the snow.`}],rightFeedback:`Yes! He is happy because he gets to play in the snow.`,passage:`Sam got ready to go outside. He put on his red hat and his warm coat. Then he opened the door and felt the cold air on his nose. Sam smiled and ran out to play in the snow.`},{id:`r1q3`,skill:`Word meaning`,prompt:`In the story, what does 'warm' mean?`,choices:[`Very cold`,`Keeps you cozy`,`Wet`,`Loud`],answerIndex:1,hints:[`Close. A warm coat is what you wear when it is cold outside. Does it make you cold or cozy?`,`'Warm' means it keeps your body cozy. That's why Sam puts it on before he goes out in the cold.`],nudge:`You're close. Think about what a warm coat does for you on a cold day.`,steps:[{title:`Find the word`,detail:`The story says Sam put on his warm coat.`},{title:`Think about the coat`,detail:`A coat goes on when it is cold outside.`},{title:`What warm does`,detail:`Warm means it keeps you cozy.`}],rightFeedback:`Yes! Warm means it keeps you cozy.`,passage:`Sam got ready to go outside. He put on his red hat and his warm coat. Then he opened the door and felt the cold air on his nose. Sam smiled and ran out to play in the snow.`}]},{id:`math-2`,subject:`math`,grade:2,topic:`Adding and subtracting within 100`,questions:[{id:`m2q1`,skill:`Adding two-digit numbers`,prompt:`There are 38 kids in the gym. Then 27 more kids come in. How many kids are in the gym now?`,choices:[`55`,`65`,`56`,`615`],answerIndex:1,hints:[`Close. Try adding the ones first: 8 + 7. That makes more than 9, so something has to carry over.`,`8 + 7 = 15. Keep the 5 in the ones place and carry the 1 ten up. Now add the tens: 3 + 2 + 1.`],nudge:`You're close. Add the ones column first, and remember to carry when it goes past 9.`,steps:[{title:`Add the ones`,detail:`8 + 7 = 15. That's 5 ones and 1 extra ten.`},{title:`Carry the ten`,detail:`Write 5 in the ones place and carry the 1 up to the tens.`},{title:`Add the tens`,detail:`3 + 2 + 1 = 6 tens. So the answer is 65.`}],rightFeedback:`Yes! 65. You carried the ten and got it right.`},{id:`m2q2`,skill:`Subtracting with borrowing`,prompt:`What is 52 - 27?`,choices:[`25`,`35`,`24`,`39`],answerIndex:0,hints:[`Close. You can't take 7 away from 2 in the ones place. What could you borrow?`,`Borrow 1 ten from the 5: now you have 4 tens and 12 ones. 12 - 7 = 5.`],nudge:`You're close. Look at the ones place first. Can you take the bottom number away from the top one?`,steps:[{title:`Check the ones`,detail:`2 - 7 doesn't work, so borrow a ten from the 5.`},{title:`Borrow`,detail:`The 5 becomes 4, and the 2 becomes 12. Now 12 - 7 = 5.`},{title:`Subtract the tens`,detail:`4 - 2 = 2 tens, and 5 ones. The answer is 25.`}],rightFeedback:`Nice. 25. Borrowing is the trick that makes it work.`},{id:`m2q3`,skill:`Skip counting`,prompt:`Count by 5s: 15, 20, 25, ... what comes next?`,choices:[`26`,`30`,`35`,`40`],answerIndex:1,hints:[`Close. Each jump is 5. What is 25 plus 5?`,`25 + 5: the ones go 5 to 0, and the tens go up by one. That makes 30.`],nudge:`You're close. You're adding 5 each time, not 1.`,steps:[{title:`Look at the pattern`,detail:`Each number is 5 more than the one before it.`},{title:`Add 5 to 25`,detail:`25 + 5. The 5 in the ones place rolls over.`},{title:`That's 30`,detail:`The next number is 30.`}],rightFeedback:`Yes! 30. Count by 5s and the ones digit goes 5, 0, 5, 0.`}]},{id:`reading-2`,subject:`reading`,grade:2,topic:`Story details and word meaning`,questions:[{id:`r2q1`,skill:`Finding details in a story`,prompt:`Where did Pepper put the bone?`,choices:[`In her bowl`,`Under a bush`,`In a hole by the porch`,`In the house`],answerIndex:2,hints:[`Close. Go back to the story and look for the words 'dug' and 'porch'.`,`The story says Pepper 'dug a hole by the porch and buried the bone deep in the dirt.'`],nudge:`You're close. Find the sentence that tells where she put it.`,steps:[{title:`Reread the second part`,detail:`Pepper wanted to hide the bone from Max.`},{title:`Look for the hiding place`,detail:`The story says she dug a hole by the porch.`},{title:`That's the answer`,detail:`She buried the bone in a hole by the porch.`}],rightFeedback:`Exactly. In a hole by the porch.`,passage:`Pepper the dog found a big bone in the yard. She did not want her brother Max to take it. So Pepper dug a hole by the porch and buried the bone deep in the dirt. Later, Max sniffed all around the yard but could not find it. Pepper wagged her tail and lay down in the sun.`},{id:`r2q2`,skill:`How a character feels`,prompt:`How does Pepper feel at the end?`,choices:[`Scared`,`Happy`,`Angry`,`Sleepy and sad`],answerIndex:1,hints:[`Close. What does a dog do with its tail when it feels good?`,`The story says 'Pepper wagged her tail.' A wagging tail usually means a happy dog.`],nudge:`You're close. Think about what wagging a tail tells you.`,steps:[{title:`Find the ending`,detail:`Pepper lies down in the sun after Max gives up.`},{title:`Look at her tail`,detail:`She wags her tail, which dogs do when they're happy.`},{title:`So she feels happy`,detail:`She kept her bone and feels happy.`}],rightFeedback:`Yes! Happy. Wagging the tail and resting in the sun both show it.`,passage:`Pepper the dog found a big bone in the yard. She did not want her brother Max to take it. So Pepper dug a hole by the porch and buried the bone deep in the dirt. Later, Max sniffed all around the yard but could not find it. Pepper wagged her tail and lay down in the sun.`},{id:`r2q3`,skill:`What a word means`,prompt:`In the story, what does 'buried' mean?`,choices:[`Covered with dirt`,`Eaten quickly`,`Given away`,`Washed clean`],answerIndex:0,hints:[`Close. Think about what a dog does with a hole in the dirt.`,`If you dig a hole and put something in it, then cover it up, you have buried it.`],nudge:`You're close. Picture Pepper with a hole in the dirt.`,steps:[{title:`Think about the hole`,detail:`Pepper dug a hole in the dirt.`},{title:`She put the bone inside`,detail:`Then she covered it up with dirt.`},{title:`That is burying`,detail:`Buried means covered up with dirt.`}],rightFeedback:`Right. Buried means covered with dirt so it's hidden.`,passage:`Pepper the dog found a big bone in the yard. She did not want her brother Max to take it. So Pepper dug a hole by the porch and buried the bone deep in the dirt. Later, Max sniffed all around the yard but could not find it. Pepper wagged her tail and lay down in the sun.`}]},{id:`math-3`,subject:`math`,grade:3,topic:`Multiplication and division`,questions:[{id:`m3q1`,skill:`Multiplication as equal groups`,prompt:`A box holds 6 crayons. How many crayons are in 7 boxes?`,choices:[`13`,`36`,`42`,`48`],answerIndex:2,hints:[`Close. Seven boxes with 6 in each is 7 groups of 6. What is 7 times 6?`,`7 x 6 = 42. You can check it: 7 x 6 is the same as 6 + 6 + 6 + 6 + 6 + 6 + 6.`],nudge:`You're close. Adding 6 + 7 mixes the numbers up — this is a times problem.`,steps:[{title:`Picture the groups`,detail:`7 boxes, 6 crayons in each box.`},{title:`Multiply`,detail:`7 x 6 = 42.`},{title:`Check it`,detail:`6 + 6 + 6 + 6 + 6 + 6 + 6 = 42, so it's right.`}],rightFeedback:`Yes! 42 crayons.`},{id:`m3q2`,skill:`Division facts`,prompt:`What is 56 / 8?`,choices:[`6`,`7`,`8`,`9`],answerIndex:1,hints:[`Close. Ask yourself: 8 times what number gives 56?`,`8 x 7 = 56. So 56 divided by 8 is 7.`],nudge:`You're close. Flip it into a times question — division is multiplication backwards.`,steps:[{title:`Turn it around`,detail:`Ask: 8 times what equals 56?`},{title:`Try numbers`,detail:`8 x 6 = 48, too small. 8 x 7 = 56.`},{title:`So the answer is 7`,detail:`56 / 8 = 7.`}],rightFeedback:`Exactly. 7, because 8 x 7 = 56.`},{id:`m3q3`,skill:`What multiplication means`,prompt:`Which one shows what 4 x 9 means?`,choices:[`4 + 9`,`9 + 9 + 9 + 9`,`4 + 4 + 4 + 4`,`9 x 9`],answerIndex:1,hints:[`Close. 4 x 9 means four groups of 9.`,`Four groups of 9 is 9, then 9, then 9, then 9. That's 9 + 9 + 9 + 9.`],nudge:`You're close. Multiplication means equal groups of the same number.`,steps:[{title:`What does 4 x 9 mean?`,detail:`It means 4 groups, with 9 in each group.`},{title:`Write the groups out`,detail:`9 + 9 + 9 + 9.`},{title:`That equals 36`,detail:`And 4 x 9 is 36 too.`}],rightFeedback:`Yes. Four groups of 9, which is 9 added four times.`}]},{id:`reading-3`,subject:`reading`,grade:3,topic:`Main idea and how characters change`,questions:[{id:`r3q1`,skill:`Main idea`,prompt:`What is this story mostly about?`,choices:[`A girl who gets a new bike`,`A girl who keeps trying and learns to ride`,`A dad who fixes bicycles`,`A race down the block`],answerIndex:1,hints:[`Close. Think about what Ana is doing over and over.`,`She tries, wobbles, and tries again six times. Then she finally rides. The story is about not giving up.`],nudge:`You're close. The most important thing that happens is how many times she tried.`,steps:[{title:`Look at what repeats`,detail:`Ana tries, wobbles, and tries again six times.`},{title:`What changes?`,detail:`By the sixth try she is riding without help.`},{title:`That's the main idea`,detail:`She keeps trying until she learns.`}],rightFeedback:`Yes. It's about trying again until she gets it.`,passage:`Ana had never ridden a bike without training wheels. On Saturday she wheeled her bike to the end of the driveway and looked down the block. Her stomach felt tight. She pushed off, wobbled, and put her foot down. Again. And again. On the sixth try her dad let go without telling her, and Ana rode all the way to the corner before she even noticed.`},{id:`r3q2`,skill:`Inference about feelings`,prompt:`Why does Ana's stomach feel tight at the start?`,choices:[`She is hungry`,`She is nervous about riding`,`She is cold`,`She is angry at her dad`],answerIndex:1,hints:[`Close. Think about a time you were about to try something new and a little scary.`,`A tight stomach before trying something hard usually means nerves, not hunger.`],nudge:`You're close. Think about how your body feels when you're worried.`,steps:[{title:`Notice the moment`,detail:`She is standing at the driveway about to try something new.`},{title:`Connect it to the body`,detail:`A tight stomach is how nervousness feels.`},{title:`So she is nervous`,detail:`She's worried she will fall.`}],rightFeedback:`Right. That tight stomach is nerves about trying something new.`,passage:`Ana had never ridden a bike without training wheels. On Saturday she wheeled her bike to the end of the driveway and looked down the block. Her stomach felt tight. She pushed off, wobbled, and put her foot down. Again. And again. On the sixth try her dad let go without telling her, and Ana rode all the way to the corner before she even noticed.`},{id:`r3q3`,skill:`Word meaning in context`,prompt:`What does 'wobbled' mean in the story?`,choices:[`Rode perfectly`,`Shook from side to side`,`Stopped suddenly`,`Pedaled very fast`],answerIndex:1,hints:[`Close. Picture a bike that hasn't found its balance yet.`,`A bike that wobbles tips a little from side to side before it steadies out.`],nudge:`You're close. Think about what a bike does right before it falls over.`,steps:[{title:`Picture the bike`,detail:`Ana just pushed off and has no balance yet.`},{title:`What does it do?`,detail:`It leans and shakes from side to side.`},{title:`That is wobbling`,detail:`So wobbled means shook side to side.`}],rightFeedback:`Yes. It shook from side to side, which is why she put her foot down.`,passage:`Ana had never ridden a bike without training wheels. On Saturday she wheeled her bike to the end of the driveway and looked down the block. Her stomach felt tight. She pushed off, wobbled, and put her foot down. Again. And again. On the sixth try her dad let go without telling her, and Ana rode all the way to the corner before she even noticed.`}]},{id:`math-4`,subject:`math`,grade:4,topic:`Fractions`,questions:[{id:`m4q1`,skill:`Comparing fractions with unlike denominators`,prompt:`Which is bigger: 3/5 or 2/3?`,choices:[`3/5`,`2/3`,`They are the same`,`You can't compare them`],answerIndex:1,hints:[`Close. Before you compare them, can you find one number that both 5 and 3 divide into evenly?`,`15 works. So 3/5 turns into fifteenths by multiplying top and bottom by 3. What does 2/3 turn into?`],nudge:`You're close. Look at the bottom numbers and think about which one is cut into smaller pieces.`,steps:[{title:`Find a common denominator`,detail:`Both 5 and 3 divide evenly into 15. So 15 is our common denominator.`},{title:`Rewrite 3/5 as fifteenths`,detail:`Multiply top and bottom by 3: 3 x 3 = 9, 5 x 3 = 15. That gives 9/15.`},{title:`Rewrite 2/3 as fifteenths`,detail:`Multiply top and bottom by 5: 2 x 5 = 10, 3 x 5 = 15. That gives 10/15.`},{title:`Compare the tops`,detail:`The pieces are the same size now, so the bigger top wins. 10 is bigger than 9, so 2/3 is bigger than 3/5.`}],rightFeedback:`Yes! 2/3 is bigger. Using 15 as a common denominator, 3/5 is 9/15 and 2/3 is 10/15, so 10 beats 9.`,visuals:[{label:`3/5`,numerator:3,denominator:5,tone:`grape`},{label:`2/3`,numerator:2,denominator:3,tone:`sky`}]},{id:`m4q2`,skill:`Equivalent fractions`,prompt:`2/3 is the same as how many twelfths?`,choices:[`4/12`,`8/12`,`6/12`,`2/12`],answerIndex:1,hints:[`Almost. The bottom of your fraction has to get from 3 to 12. What do you multiply 3 by to get there?`,`3 x 4 = 12. Whatever you do to the bottom you have to do to the top. So what is 2 x 4?`],nudge:`You're close. Whatever you do to the bottom number has to happen to the top number too.`,steps:[{title:`Look at the bottom numbers`,detail:`You start with thirds and need twelfths. From 3 to 12 means multiplying by 4.`},{title:`Do the same to the top`,detail:`Multiply the top by 4 too: 2 x 4 = 8.`},{title:`Write it out`,detail:`2/3 becomes 8/12. You can check it: 8/12 shrinks back down to 2/3 when you divide both by 4.`}],rightFeedback:`Exactly. 3 times 4 is 12, so 2 times 4 is 8. That gives 8/12.`,visuals:[{label:`2/3`,numerator:2,denominator:3,tone:`grape`},{label:`?/12`,numerator:0,denominator:12,tone:`sky`}]},{id:`m4q3`,skill:`Adding fractions with like denominators`,prompt:`What is 1/4 + 2/4?`,choices:[`3/8`,`3/4`,`2/8`,`3/16`],answerIndex:1,hints:[`Almost. Look at the bottom numbers first. What do both of them have in common?`,`Both bottoms are 4, so the pieces are already the same size. Now leave the 4 alone and just add the top numbers.`],nudge:`You're close. The pieces are already the same size here, so only the top numbers move.`,steps:[{title:`Check the bottom numbers`,detail:`Both fractions are fourths. The pieces are already the same size, so nothing needs converting.`},{title:`Add only the top numbers`,detail:`1 + 2 = 3. The tops count how many pieces you have.`},{title:`Keep the bottom the same`,detail:`The answer is 3/4. Do not add the bottoms: 4 + 4 = 8 is a common mistake, and 3/8 would be a smaller number than 1/4.`}],rightFeedback:`Nice. Same size pieces, so add the tops only: 1 plus 2 is 3, and the fourths stay fourths. That is 3/4.`,visuals:[{label:`1/4`,numerator:1,denominator:4,tone:`grape`},{label:`2/4`,numerator:2,denominator:4,tone:`sky`}]}]},{id:`reading-4`,subject:`reading`,grade:4,topic:`Inference, theme, and vocabulary`,questions:[{id:`r4q1`,skill:`Inference from details`,prompt:`Why could Jonah answer the judge's question right away?`,choices:[`He copied it from a book`,`He had tested it himself and wondered about it`,`His teacher told him the answer`,`He guessed`],answerIndex:1,hints:[`Close. Think about what Jonah did on Thursday night instead of reading about it.`,`He rolled the balls down the ramp for two hours and the story says 'He had actually wondered about it himself.'`],nudge:`You're close. What did Jonah do with the balls and the ramp?`,steps:[{title:`Look at Thursday night`,detail:`He stacked boxes and rolled different balls down a ramp for two hours.`},{title:`Notice what that means`,detail:`He saw the heaviest ball go farther with his own eyes.`},{title:`That's why he knew`,detail:`He had wondered about it himself, so the answer made sense to him.`}],rightFeedback:`Exactly. He had tested it himself, so the answer was already his.`,passage:`The science fair was on Friday, and Jonah still did not have a project. Everyone else had been working for weeks. On Thursday night he stacked three boxes in the garage, taped a cardboard ramp to them, and spent two hours rolling different balls down it, marking how far each one traveled. His board was messier than the others. But on Friday, when the judge asked why the heaviest ball went the farthest, Jonah answered right away. He had actually wondered about it himself.`},{id:`r4q2`,skill:`Theme`,prompt:`What lesson does this story suggest?`,choices:[`Messy work is always better`,`Waiting until the last minute can still work if you really try`,`Science fairs are unfair`,`You should copy your friends`],answerIndex:1,hints:[`Close. Jonah did not have weeks. He had one night. But what did he do with that night?`,`He worked hard and tested it for real. The story doesn't say he should have waited — it says the effort paid off.`],nudge:`You're close. Think about what Jonah actually did, not what he should have done earlier.`,steps:[{title:`Jonah started late`,detail:`He had one night instead of weeks.`},{title:`But look at what he did`,detail:`He spent two hours testing balls for real.`},{title:`The lesson`,detail:`He still did honest work, and it paid off.`}],rightFeedback:`Yes. The ending rewards him for testing it himself, even on one night's work.`,passage:`The science fair was on Friday, and Jonah still did not have a project. Everyone else had been working for weeks. On Thursday night he stacked three boxes in the garage, taped a cardboard ramp to them, and spent two hours rolling different balls down it, marking how far each one traveled. His board was messier than the others. But on Friday, when the judge asked why the heaviest ball went the farthest, Jonah answered right away. He had actually wondered about it himself.`},{id:`r4q3`,skill:`Vocabulary in context`,prompt:`In the story, 'board' means:`,choices:[`A piece of wood`,`His display for the science fair`,`A game`,`A group of judges`],answerIndex:1,hints:[`Close. Read the sentence around it: 'His board was messier than the others.' What do the other kids have?`,`At a science fair, each kid brings a display board to show their project. That's what his board is.`],nudge:`You're close. Use the words around it — 'messier than the others' tells you what?`,steps:[{title:`Zoom in on the sentence`,detail:`'His board was messier than the others.'`},{title:`Ask what makes sense`,detail:`At a science fair, every kid has a display board.`},{title:`So board means display`,detail:`It means his science fair display.`}],rightFeedback:`Right. In this story the board is his science fair display, not a piece of wood.`,passage:`The science fair was on Friday, and Jonah still did not have a project. Everyone else had been working for weeks. On Thursday night he stacked three boxes in the garage, taped a cardboard ramp to them, and spent two hours rolling different balls down it, marking how far each one traveled. His board was messier than the others. But on Friday, when the judge asked why the heaviest ball went the farthest, Jonah answered right away. He had actually wondered about it himself.`}]},{id:`math-5`,subject:`math`,grade:5,topic:`Fractions, decimals and volume`,questions:[{id:`m5q1`,skill:`Adding fractions with unlike denominators`,prompt:`What is 1/2 + 1/3?`,choices:[`2/5`,`5/6`,`1/6`,`2/6`],answerIndex:1,hints:[`Close. You can't add halves and thirds until the pieces are the same size. What number do 2 and 3 both divide into?`,`6 works. 1/2 becomes 3/6 and 1/3 becomes 2/6. Now add the tops.`],nudge:`You're close. Find a number both bottom numbers go into before adding anything.`,steps:[{title:`Find a common denominator`,detail:`2 and 3 both divide into 6.`},{title:`Convert each fraction`,detail:`1/2 = 3/6 and 1/3 = 2/6.`},{title:`Add the tops`,detail:`3 + 2 = 5, so the answer is 5/6. Note it is NOT 2/5: you never add the bottoms.`}],rightFeedback:`Yes! 5/6. Convert both to sixths first, then add the tops.`,visuals:[{label:`1/2`,numerator:1,denominator:2,tone:`grape`},{label:`1/3`,numerator:1,denominator:3,tone:`sky`}]},{id:`m5q2`,skill:`Adding decimals`,prompt:`What is 0.7 + 0.25?`,choices:[`0.32`,`0.95`,`0.77`,`1.7`],answerIndex:1,hints:[`Close. Line up the decimal points first: 0.70 on top of 0.25.`,`Add like normal numbers: 70 + 25 = 95, then put the decimal back: 0.95.`],nudge:`You're close. Write 0.7 as 0.70 so both numbers have the same number of places.`,steps:[{title:`Line up the decimals`,detail:`Write it as 0.70 + 0.25 so the places match.`},{title:`Add the hundredths`,detail:`0 + 5 = 5 hundredths.`},{title:`Add the tenths`,detail:`7 + 2 = 9 tenths. The answer is 0.95.`}],rightFeedback:`Exactly. 0.95. Lining up the decimal points is what makes it work.`},{id:`m5q3`,skill:`Volume of a rectangular box`,prompt:`A box is 3 cm long, 4 cm wide and 2 cm tall. What is its volume?`,choices:[`9 cubic cm`,`24 cubic cm`,`12 cubic cm`,`18 cubic cm`],answerIndex:1,hints:[`Close. Volume of a box is length x width x height. Try multiplying two of them first.`,`3 x 4 = 12. Now multiply that by the height, 2. 12 x 2 = 24.`],nudge:`You're close. Volume uses all three measurements, not two.`,steps:[{title:`Use all three`,detail:`Volume = length x width x height.`},{title:`Multiply two first`,detail:`3 x 4 = 12 square cm for the bottom.`},{title:`Then the height`,detail:`12 x 2 = 24 cubic cm.`}],rightFeedback:`Yes. 24 cubic cm, because you multiplied all three sides.`}]},{id:`reading-5`,subject:`reading`,grade:5,topic:`Theme, figurative language, and summarizing`,questions:[{id:`r5q1`,skill:`Theme`,prompt:`What is this passage mostly saying?`,choices:[`Old recipes are unhealthy`,`Some things are worth more than they look`,`Grandma is bad with computers`,`Families should not move`],answerIndex:1,hints:[`Close. The passage calls the drawer 'where the real treasure was.' Why would recipe cards be treasure?`,`The cards hold something nobody else has: her recipes, in her handwriting, stained from years of cooking.`],nudge:`You're close. The writer keeps calling the cards a treasure, and they are not money.`,steps:[{title:`Notice the word 'treasure'`,detail:`The writer calls the drawer the real treasure.`},{title:`Why are they valuable?`,detail:`They are the only copy, in her handwriting, marked by years of use.`},{title:`That's the point`,detail:`They are worth more than they look.`}],rightFeedback:`Yes. The cards look ordinary but carry her whole history.`,passage:`Grandma's kitchen always smelled like cinnamon, but the drawer by the stove was where the real treasure was. Inside, dozens of index cards were stacked in a rubber band, each one in her small, slanting handwriting. Some were stained with butter. When Grandma moved into the apartment, she brought two suitcases and that drawer. The recipes weren't written down anywhere else. Last month my aunt asked her to type them into the computer, and Grandma said she would. The cards are still in the drawer.`},{id:`r5q2`,skill:`Figurative language`,prompt:`The writer says the cards are 'stained with butter.' What does that tell you?`,choices:[`Grandma was messy`,`The cards were actually used for cooking`,`The cards are ruined`,`Someone spilled lunch`],answerIndex:1,hints:[`Close. Think about how butter gets on a recipe card in the first place.`,`You only get butter on a recipe card if the card was open on the counter while you cooked from it.`],nudge:`You're close. Where would butter have to be for it to get on a recipe card?`,steps:[{title:`Picture the kitchen`,detail:`The card is sitting open while Grandma cooks.`},{title:`How does butter get there?`,detail:`From her hands, or from the pan, during real cooking.`},{title:`So the cards were used`,detail:`They are stained because they were actually used, not just saved.`}],rightFeedback:`Right. The stains prove the cards were used for real cooking, which makes them more valuable.`,passage:`Grandma's kitchen always smelled like cinnamon, but the drawer by the stove was where the real treasure was. Inside, dozens of index cards were stacked in a rubber band, each one in her small, slanting handwriting. Some were stained with butter. When Grandma moved into the apartment, she brought two suitcases and that drawer. The recipes weren't written down anywhere else. Last month my aunt asked her to type them into the computer, and Grandma said she would. The cards are still in the drawer.`},{id:`r5q3`,skill:`Summarizing`,prompt:`Which sentence best summarizes the passage?`,choices:[`Grandma has a lot of recipes and might type them up someday.`,`Grandma keeps her only copies of her recipes on handwritten cards, and she hasn't typed them yet.`,`Grandma moved into an apartment with two suitcases.`,`The writer's aunt wants Grandma to use a computer.`],answerIndex:1,hints:[`Close. A good summary covers what is most important, not just one detail.`,`The big idea is that the cards are the only copies, they're handwritten, and she hasn't typed them.`],nudge:`You're close. Which option covers the whole passage instead of one small part?`,steps:[{title:`What's the main thing?`,detail:`The cards are the only copies of her recipes.`},{title:`What's the ending?`,detail:`She hasn't typed them yet, so they're still only on paper.`},{title:`Cover both`,detail:`The answer that mentions both is the best summary.`}],rightFeedback:`Exactly. That option covers the cards, what makes them special, and the ending.`,passage:`Grandma's kitchen always smelled like cinnamon, but the drawer by the stove was where the real treasure was. Inside, dozens of index cards were stacked in a rubber band, each one in her small, slanting handwriting. Some were stained with butter. When Grandma moved into the apartment, she brought two suitcases and that drawer. The recipes weren't written down anywhere else. Last month my aunt asked her to type them into the computer, and Grandma said she would. The cards are still in the drawer.`}]},{id:`math-6`,subject:`math`,grade:6,topic:`Ratios, rates and percent`,questions:[{id:`m6q1`,skill:`Equivalent ratios`,prompt:`The ratio of cats to dogs at the shelter is 3 to 4. If there are 12 cats, how many dogs are there?`,choices:[`9`,`16`,`15`,`12`],answerIndex:1,hints:[`Close. Ask what you multiplied the 3 by to get 12. Do the same to the 4.`,`3 x 4 = 12, so multiply the 4 by 4 too. 4 x 4 = 16.`],nudge:`You're close. Whatever you do to one side of a ratio you have to do to the other.`,steps:[{title:`Find the multiplier`,detail:`The cats went from 3 to 12, so they were multiplied by 4.`},{title:`Apply it to the dogs`,detail:`Multiply the 4 by the same 4: 4 x 4 = 16.`},{title:`Check it`,detail:`12 to 16 reduces to 3 to 4 when you divide both by 4, so it's right.`}],rightFeedback:`Yes! 16 dogs, because both sides were multiplied by 4.`},{id:`m6q2`,skill:`Unit rate`,prompt:`A runner goes 12 miles in 3 hours. What is her speed in miles per hour?`,choices:[`36 miles per hour`,`4 miles per hour`,`9 miles per hour`,`15 miles per hour`],answerIndex:1,hints:[`Close. Miles per hour means how many miles in ONE hour. Divide the miles by the hours.`,`12 divided by 3 is 4, so she runs 4 miles each hour.`],nudge:`You're close. 'Per hour' means for one hour, so divide.`,steps:[{title:`What does per hour mean?`,detail:`How far she goes in exactly 1 hour.`},{title:`Divide`,detail:`12 miles / 3 hours = 4 miles for each hour.`},{title:`Check it`,detail:`4 miles per hour for 3 hours is 12 miles, so it works.`}],rightFeedback:`Exactly. 4 miles per hour. Divide the distance by the time.`},{id:`m6q3`,skill:`Percent of a number`,prompt:`What is 25% of 80?`,choices:[`20`,`25`,`40`,`55`],answerIndex:0,hints:[`Close. 25% is the same as one quarter. What is 80 divided by 4?`,`80 divided by 4 is 20. So 25% of 80 is 20.`],nudge:`You're close. Percent means out of 100, and 25 out of 100 is one quarter.`,steps:[{title:`Translate the percent`,detail:`25% = 25/100 = 1/4.`},{title:`Take a quarter of 80`,detail:`80 divided by 4 is 20.`},{title:`Check it`,detail:`20 x 4 = 80, so 20 really is a quarter of it.`}],rightFeedback:`Yes. 20, because 25% is one quarter and a quarter of 80 is 20.`}]},{id:`reading-6`,subject:`reading`,grade:6,topic:`Author's purpose, evidence, and word choice`,questions:[{id:`r6q1`,skill:`Author's purpose`,prompt:`Why did the author include the detail that the benches were 'old, splintered, and always in the shade'?`,choices:[`To show the benches were dangerous`,`To show the benches were easy to dismiss as unimportant`,`To describe the weather`,`To prove the city was right`],answerIndex:1,hints:[`Close. Think about how you would feel about removing a bench you were told was splintered and in the shade.`,`Those details make the benches sound worthless, which sets up how surprising Ruth's quiet protest is.`],nudge:`You're close. Why would the author make the benches sound bad before showing they mattered?`,steps:[{title:`Read the details closely`,detail:`Old, splintered, always in the shade.`},{title:`What do they make you think?`,detail:`That nobody would miss them.`},{title:`Then the story flips`,detail:`Eleven people use them daily, so the author is setting up a surprise.`}],rightFeedback:`Exactly. The details make the benches easy to dismiss, which makes their importance land harder.`,passage:`When the city announced it would remove the benches from the bus stop on Ninth Street, the first response was silence. The benches were old, splintered, and always in the shade. Then someone counted: eleven people used them every morning before seven. A woman named Ruth started bringing a folding chair at 6:15 and sitting there, holding a sign that listed nothing but those eleven first names. She did not argue. She did not speak at the meeting. By the second week, three city council members had visited the bench themselves.`},{id:`r6q2`,skill:`Citing evidence`,prompt:`Which detail best supports the idea that Ruth's approach worked?`,choices:[`She brought a folding chair`,`She listed eleven first names on a sign`,`Three council members visited the bench`,`She did not speak at the meeting`],answerIndex:2,hints:[`Close. Which detail shows someone in power changing what they did?`,`Council members visiting the bench themselves is the only detail that shows the city reacting.`],nudge:`You're close. Look for the detail that shows a result, not just an action Ruth took.`,steps:[{title:`Separate actions from results`,detail:`The chair, the sign, and her silence are all things Ruth did.`},{title:`Find the reaction`,detail:`Three council members visiting the bench is the city responding.`},{title:`That's the evidence`,detail:`It shows her quiet method changed minds.`}],rightFeedback:`Right. The council members showing up is proof the approach worked.`,passage:`When the city announced it would remove the benches from the bus stop on Ninth Street, the first response was silence. The benches were old, splintered, and always in the shade. Then someone counted: eleven people used them every morning before seven. A woman named Ruth started bringing a folding chair at 6:15 and sitting there, holding a sign that listed nothing but those eleven first names. She did not argue. She did not speak at the meeting. By the second week, three city council members had visited the bench themselves.`},{id:`r6q3`,skill:`Connotation`,prompt:`The author writes that the first response was 'silence.' What does that word suggest?`,choices:[`People were asleep`,`People accepted it without objecting`,`The city was quiet and peaceful`,`Everyone agreed loudly`],answerIndex:1,hints:[`Close. Silence after bad news is not usually peaceful. What does it mean when nobody speaks up?`,`'Silence' here is the sound of nobody objecting. The passage says the benches were easy to ignore.`],nudge:`You're close. Silence in this sentence means nobody said anything against it.`,steps:[{title:`Read the sentence`,detail:`The first response was silence.`},{title:`What kind of silence?`,detail:`Not peaceful — the silence of no one objecting.`},{title:`That's the connotation`,detail:`It suggests quiet acceptance, which is why Ruth's sign stands out.`}],rightFeedback:`Yes. It suggests people let it happen without objecting, which makes Ruth's small act matter more.`,passage:`When the city announced it would remove the benches from the bus stop on Ninth Street, the first response was silence. The benches were old, splintered, and always in the shade. Then someone counted: eleven people used them every morning before seven. A woman named Ruth started bringing a folding chair at 6:15 and sitting there, holding a sign that listed nothing but those eleven first names. She did not argue. She did not speak at the meeting. By the second week, three city council members had visited the bench themselves.`}]}],hs={weekOf:`Week of Oct 26`,minutesPracticed:74,questionsAttempted:38,questionsCorrect:31,math:[{name:`Adding and subtracting within 100`,accuracy:.92},{name:`Fractions`,accuracy:.62},{name:`Ratios and rates`,accuracy:.78}],reading:[{name:`Finding details in a story`,accuracy:.95},{name:`Inference and theme`,accuracy:.71},{name:`Vocabulary in context`,accuracy:.84}],note:`Same-denominator fraction work is solid. Comparing fractions with different denominators is the one to watch: the pattern is guessing instead of finding a common denominator. In reading, inference questions are the weak spot, so ask about why a character did something, not just what happened.`},gs={student:ps,decks:ms,parentReport:hs}}));function vs(e){return Ss.find(t=>t===e)??`grape`}function ys(e){return e===`reading`?`reading`:`math`}function bs(e){let t=Number(e);return t===1||t===2||t===3||t===4||t===5||t===6?t:4}function xs({subject:e,grade:t}={}){let n=ys(e),r=bs(t),i=gs.decks.find(e=>e.subject===n&&e.grade===r)??gs.decks[0];return{student:gs.student,subject:n,grade:r,topic:i.topic,questions:i.questions.map(e=>({id:e.id,skill:e.skill,prompt:e.prompt,choices:[...e.choices],answerIndex:e.answerIndex,hints:[...e.hints],nudge:e.nudge,steps:e.steps.map(e=>({...e})),rightFeedback:e.rightFeedback,passage:`passage`in e?e.passage:void 0,visuals:`visuals`in e?e.visuals?.map(e=>(

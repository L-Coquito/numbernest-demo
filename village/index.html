<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Village</title>
    <meta
      name="description"
      content="A little simulated village where Claude's agents live and work: they claim tasks from the board, build, research, review, eat at the Token Café and go home at night."
    />
    <meta name="theme-color" content="#d97757" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15L16 5l12 10v13H4z' fill='%23d97757'/%3E%3Crect x='13' y='19' width='6' height='9' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #f6f1ea;
        --surface: #fffdf9;
        --text: #2b2620;
        --muted: #6f665c;
        --line: #e4dbcf;
        --accent: #c2603f;
        --accent-soft: #f6e1d7;
        --chip: #efe7dc;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1a17;
          --surface: #262320;
          --text: #efe9e1;
          --muted: #a89f94;
          --line: #3a352f;
          --accent: #e58a68;
          --accent-soft: #3e2c24;
          --chip: #312d28;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c1a17;
        --surface: #262320;
        --text: #efe9e1;
        --muted: #a89f94;
        --line: #3a352f;
        --accent: #e58a68;
        --accent-soft: #3e2c24;
        --chip: #312d28;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; }
      header {
        display: flex; flex-wrap: wrap; gap: 12px 24px;
        align-items: flex-end; justify-content: space-between; margin-bottom: 14px;
      }
      h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
      header p { margin: 2px 0 0; color: var(--muted); }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      #clock {
        font-variant-numeric: tabular-nums; font-weight: 600;
        padding: 6px 12px; border-radius: 999px; background: var(--chip);
      }
      button {
        font: inherit; color: var(--text); background: var(--surface);
        border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent-soft); border-color: var(--accent); }
      .seg { display: inline-flex; }
      .seg button { border-radius: 0; margin-left: -1px; }
      .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
      .seg button:last-child { border-radius: 0 8px 8px 0; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
      @media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
      .map {
        background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
        min-width: 0;
      }
      .scroll { overflow-x: auto; border-radius: 8px; }
      canvas { display: block; width: 100%; min-width: 720px; height: auto; cursor: pointer; border-radius: 8px; }
      .roster { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .roster button {
        display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px;
        border-radius: 999px; font-size: 13px;
      }
      .roster small { color: var(--muted); }
      .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
      aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
      .card h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .who { display: flex; gap: 12px; align-items: center; }
      .who .dot { width: 34px; height: 34px; }
      .who b { font-size: 18px; display: block; }
      .who span { color: var(--muted); font-size: 13px; }
      .bio { margin: 10px 0; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
      dt { color: var(--muted); }
      dd { margin: 0; }
      ul { list-style: none; margin: 0; padding: 0; }
      #board li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
      #board li:first-child { border-top: 0; }
      #board .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 2px; }
      #board .mine { color: var(--accent); font-weight: 600; }
      #board .done { opacity: 0.55; text-decoration: line-through; }
      .bar { height: 4px; background: var(--chip); border-radius: 2px; margin-top: 5px; overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--accent); }
      form { display: flex; gap: 6px; margin-bottom: 10px; }
      input {
        flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg);
        border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
      }
      #log { max-height: 260px; overflow-y: auto; font-size: 13px; }
      #log li { padding: 3px 0; }
      #log time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
      .hint { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Agent Village</h1>
          <p>Where Claude and its agents live and work. Click a villager to meet them.</p>
        </div>
        <div class="controls">
          <span id="clock">Day 1 · 07:30</span>
          <button id="pause">Pause</button>
          <span class="seg" id="speed">
            <button data-s="1" class="on">1×</button><button data-s="4">4×</button><button data-s="16">16×</button>
          </span>
          <button id="bell">🔔 Town meeting</button>
        </div>
      </header>

      <div class="layout">
        <section class="map">
          <div class="scroll"><canvas id="c" aria-label="Map of Agent Village"></canvas></div>
          <div class="roster" id="roster"></div>
          <p class="hint">
            Days run 06:30–21:30. Agents claim cards from the Town Square board, work through each stage
            in the right building, and break for meals at the Token Café.
          </p>
        </section>

        <aside>
          <div class="card" id="profile"></div>
          <div class="card">
            <h2>Task board</h2>
            <form id="post">
              <input id="postText" maxlength="70" placeholder="Post a task, e.g. “Review the login PR”" />
              <button>Post</button>
            </form>
            <ul id="board"></ul>
          </div>
          <div class="card">
            <h2>Village log</h2>
            <ul id="log"></ul>
          </div>
        </aside>
      </div>
    </div>

    <script>
      "use strict";
      // ---------- canvas ----------
      const cv = document.getElementById("c");
      const ctx = cv.getContext("2d");
      const W = 1000, H = 620, DPR = 2;
      cv.width = W * DPR; cv.height = H * DPR;
      ctx.scale(DPR, DPR);

      let seed = 7;
      const srand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      // ---------- places ----------
      // Rooms are drawn roofless (top-down cutaway). Furniture coords are relative to the room.
      const places = {
        library:  { name: "Research Library", x: 35,  y: 110, w: 150, h: 140, door: "bottom", floor: "#eadcc2",
          furn: [["shelf",10,10,130,9],["shelf",10,34,130,9],["shelf",10,58,55,9],["shelf",85,58,55,9],["table",45,92,60,16],["plant",128,118,12,12]] },
        workshop: { name: "Code Workshop", x: 220, y: 110, w: 170, h: 140, door: "bottom", floor: "#dfe3e8",
          furn: [["desk",14,14,40,16],["desk",65,14,40,16],["desk",116,14,40,16],["desk",14,62,40,16],["desk",116,62,40,16],["bench",62,100,46,14]] },
        studio:   { name: "Design Studio", x: 425, y: 110, w: 150, h: 140, door: "bottom", floor: "#f1e6ef",
          furn: [["board",10,10,130,8],["easel",20,50,22,22],["easel",108,50,22,22],["table",50,92,50,20],["plant",12,118,12,12]] },
        review:   { name: "Review Hall", x: 610, y: 110, w: 150, h: 140, door: "bottom", floor: "#e7e0d4",
          furn: [["podium",65,10,20,10],["long",25,45,100,28],["plant",12,12,12,12],["plant",126,12,12,12]] },
        compute:  { name: "Compute Hall", x: 795, y: 110, w: 170, h: 140, door: "bottom", floor: "#d9dde3",
          furn: [["rack",14,14,14,58],["rack",40,14,14,58],["rack",66,14,14,58],["rack",92,14,14,58],["rack",118,14,14,58],["rack",144,14,14,58],["desk",62,100,46,14]] },
        cafe:     { name: "Token Café", x: 40, y: 335, w: 180, h: 115, door: "top", floor: "#f0dcc6",
          furn: [["counter",10,85,70,18],["round",105,22,22,22],["round",145,22,22,22],["round",125,70,22,22],["plant",12,12,12,12]] },
        plaza:    { name: "Town Square", cx: 340, cy: 400, r: 62 },
        pond:     { name: "Context Pond", cx: 270, cy: 548, rx: 165, ry: 48 },
      };
      const homeXs = [600, 700, 800, 900];
      ["h1","h2","h3","h4","h5","h6","h7","h8"].forEach((id, i) => {
        const row = i < 4 ? 0 : 1;
        places[id] = {
          name: "Cottage", home: true, x: homeXs[i % 4] - 40, y: row ? 515 : 330, w: 80, h: 90, door: "top",
          floor: "#efe4cf", furn: [["bed",8,52,28,32],["rug",42,30,28,20],["plant",62,74,12,12]],
        };
      });

      // ---------- road graph ----------
      const nodes = {};
      const edges = [];
      const N = (id, x, y) => (nodes[id] = { id, x, y, adj: [] });
      const E = (a, b, kind) => { nodes[a].adj.push(b); nodes[b].adj.push(a); edges.push([a, b, kind]); };
      const R1 = 290, R2 = 475;
      const road1 = new Set([20, 520, 980]), road2 = new Set([520, 980]);
      for (const [id, p] of Object.entries(places)) {
        if (id === "plaza") { N("d_plaza", p.cx, p.cy); road1.add(p.cx); continue; }
        if (id === "pond") { N("d_pond", 330, 494); continue; }
        const cx = p.x + p.w / 2;
        N("d_" + id, cx, p.door === "bottom" ? p.y + p.h : p.y);
        (p.y > R2 ? road2 : road1).add(cx);
      }
      const r1 = [...road1].sort((a, b) => a - b), r2 = [...road2].sort((a, b) => a - b);
      r1.forEach((x) => N("r1_" + x, x, R1));
      r2.forEach((x) => N("r2_" + x, x, R2));
      r1.slice(1).forEach((x, i) => E("r1_" + r1[i], "r1_" + x, "road"));
      r2.slice(1).forEach((x, i) => E("r2_" + r2[i], "r2_" + x, "road"));
      E("r1_520", "r2_520", "road");
      for (const [id, p] of Object.entries(places)) {
        if (id === "pond") continue;
        const d = nodes["d_" + id];
        E(d.id, (p.y > R2 ? "r2_" : "r1_") + d.x, "path");
      }
      E("d_pond", "d_plaza", "path");

      function route(a, b) {
        const prev = { [a]: null }, q = [a];
        while (q.length) {
          const n = q.shift();
          if (n === b) break;
          for (const m of nodes[n].adj) if (!(m in prev)) { prev[m] = n; q.push(m); }
        }
        const path = [];
        for (let n = b; n != null; n = prev[n]) path.unshift({ x: nodes[n].x, y: nodes[n].y });
        return path;
      }

      // Standing spots: grid points inside each room that don't collide with furniture.
      for (const p of Object.values(places)) {
        if (!p.furn) continue;
        p.spots = [];
        for (let x = 16; x <= p.w - 16; x += 14)
          for (let y = 16; y <= p.h - 16; y += 14) {
            const hit = p.furn.some(([t, fx, fy, fw, fh]) => t !== "rug" && x > fx - 10 && x < fx + fw + 10 && y > fy - 10 && y < fy + fh + 10);
            if (!hit) p.spots.push({ x: p.x + x, y: p.y + y });
          }
      }

      // ---------- villagers ----------
      const shared = {
        meal: ["Tokens are fresh today.", "Pass the context, please.", "Coffee with a 200k window.", "Anyone tried the cache-hit croissant?"],
        evening: ["Lovely evening.", "Anyone seen the fireflies?", "How was your day?", "I compacted my notes. Feels great.", "Long day of tool calls."],
        idle: ["Board's empty — tidying up.", "Sharpening my prompts.", "Reading old commits.", "Re-reading the style guide."],
        meeting: ["Order, order!", "Motion: more tests?", "All in favor?", "Seconded.", "Can we keep this short?"],
        wake: ["*yawn* …coming!", "Already up!", "Is it morning?"],
        sleep: ["Good night!", "Saving context…", "Sweet dreams, village."],
        done: ["Shipped! 🎉", "Done and verified.", "That's a wrap.", "Pushed to the branch."],
      };
      const agents = [
        { id: "claude", name: "Claude", role: "Village generalist", spec: "any", color: "#D97757", home: "h1",
          bio: "Moved in first. Happy to pick up anything on the board, and usually the one ringing the meeting bell.",
          lines: ["Let me take a look.", "When I have enough to act, I act.", "Small, careful diffs.", "Reading before overwriting."] },
        { id: "explore", name: "Explore", role: "Scout & searcher", spec: "research", color: "#4F9D69", home: "h2",
          bio: "Read-only by nature. Sweeps every shelf and comes back with just the conclusion.",
          lines: ["Found it — line 212.", "Checking three naming conventions…", "Very thorough, as requested.", "Excerpts, not whole files."] },
        { id: "plan", name: "Plan", role: "Architect", spec: "design", color: "#6A7FDB", home: "h3",
          bio: "Never writes the code, always draws the map. Lists the critical files and the trade-offs.",
          lines: ["Step one: understand.", "Critical files: three.", "Trade-off noted.", "Here's the plan…"] },
        { id: "gp", name: "General", role: "Builder (general-purpose)", spec: "build", color: "#C9A227", home: "h4",
          bio: "Multi-step tasks are a good day's work. Can be found at the desk nearest the coffee.",
          lines: ["Tests pass locally!", "One more refactor…", "Clear commit message: check.", "Multi-step, no problem."] },
        { id: "guide", name: "Guide", role: "Librarian (claude-code-guide)", spec: "docs", color: "#3BA7B5", home: "h5",
          bio: "Answers every “How do I…?” in the village. Knows where the docs live and cites them.",
          lines: ["Hooks live in settings.json.", "Have you tried /config?", "Let me look that up.", "There's a doc for that."] },
        { id: "review", name: "Reviewer", role: "Code reviewer", spec: "review", color: "#B55A8C", home: "h6",
          bio: "Ranks findings most-severe first. Kind, but nothing gets past the long table unchecked.",
          lines: ["Nit: rename this.", "Found an off-by-one.", "LGTM ✨", "Is this tested?"] },
        { id: "fork", name: "Fork", role: "Claude's fork", spec: "any", color: "#E9A589", home: "h7",
          bio: "Remembers everything Claude did, right up to the moment of the fork. Executes directly, never re-delegates.",
          lines: ["Wait, have we met? …Oh.", "Same context, new errand.", "On it — no re-delegating.", "Déjà vu again."] },
        { id: "status", name: "Statusline", role: "Sign keeper (statusline-setup)", spec: "ops", color: "#8A8F98", home: "h8", small: true,
          bio: "Small, tidy and very proud of the sign in the square. Only ever needs two tools.",
          lines: ["Sign updated!", "Read, Edit, done.", "Two tools is plenty.", "Status: excellent."] },
      ];
      agents.forEach((a, i) => {
        places[a.home].name = a.name + "'s Cottage";
        const bed = places[a.home];
        Object.assign(a, {
          pos: { x: bed.x + 22, y: bed.y + 68 }, path: [], place: a.home, act: { kind: "sleep", label: "Asleep", until: Infinity },
          phase: null, task: null, done: 0, jitter: (i * 7) % 40 - 20, bubble: null, face: 1, walkT: 0,
        });
      });

      // ---------- tasks ----------
      const stagesFor = {
        build:    [["workshop", 90, "Writing code"], ["compute", 40, "Running the tests"], ["review", 30, "Getting it reviewed"]],
        research: [["library", 80, "Reading sources"], ["studio", 40, "Sketching the findings"]],
        design:   [["studio", 90, "Whiteboarding"], ["review", 30, "Design review"]],
        docs:     [["library", 40, "Checking references"], ["workshop", 60, "Writing the docs"]],
        review:   [["review", 70, "Reading the diff"], ["compute", 20, "Re-running CI"]],
        ops:      [["compute", 70, "Tuning the servers"], ["workshop", 30, "Writing the runbook"]],
      };
      const titles = {
        build: ["Fix the flaky date-parser test", "Add dark mode to the dashboard", "Refactor the auth middleware", "Speed up the CSV importer", "Patch an off-by-one in pagination", "Add retries to the webhook sender"],
        research: ["Compare three vector databases", "Find why p95 latency spiked", "Survey accessible color palettes", "Map every caller of legacyFormat()", "Read the new cookies RFC"],
        design: ["Plan the v2 migration", "Sketch the onboarding flow", "Design the plugin API", "Break the monolith into milestones"],
        docs: ["Explain hooks in the README", "Write a getting-started guide", "Answer “how do I add an MCP server?”", "Document the keyboard shortcuts"],
        review: ["Review PR #42: new cache layer", "Audit the upload handler", "Review the release notes", "Check error handling in billing"],
        ops: ["Refresh the village status line", "Rotate the build cache", "Repaint the sign in the square", "Tune test-runner parallelism"],
      };
      const kinds = Object.keys(stagesFor);
      let tasks = [], taskId = 1, doneTotal = 0;
      function addTask(title, kind, mine) {
        const t = { id: taskId++, title, kind, mine: !!mine, status: "open", assignee: null, stage: 0, posted: clock,
          stages: stagesFor[kind].map(([place, dur, label]) => ({ place, dur, left: dur, label })) };
        mine ? tasks.unshift(t) : tasks.push(t);
        return t;
      }
      function classify(s) {
        s = s.toLowerCase();
        if (/review|audit|check|\bpr\b|diff|lgtm/.test(s)) return "review";
        if (/research|find|compare|investigat|why|survey|search|explore|look into/.test(s)) return "research";
        if (/plan|design|sketch|architect|roadmap|migrat|mockup/.test(s)) return "design";
        if (/doc|readme|explain|guide|how (do|to)|tutorial|write.?up/.test(s)) return "docs";
        if (/deploy|server|cache|status|sign|infra|\bci\b|monitor|ops/.test(s)) return "ops";
        return "build";
      }
      function pickTask(a) {
        const open = tasks.filter((t) => t.status === "open");
        return open.find((t) => t.mine) || open.find((t) => t.kind === a.spec) ||
          (a.spec === "any" || open.some((t) => clock - t.posted > 120) ? open[0] : null);
      }

      // ---------- clock & log ----------
      let clock = 7 * 60 + 30, speed = 1, paused = false, meetingUntil = 0;
      const hhmm = (m) => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(Math.floor(m % 60)).padStart(2, "0"); };
      const logs = [];
      const log = (text) => { logs.unshift({ t: hhmm(clock), text }); if (logs.length > 60) logs.pop(); dirty = true; };
      let dirty = true;

      kinds.slice(0, 5).forEach((k) => addTask(pick(titles[k]), k));
      let nextTaskAt = clock + 60;

      // ---------- behaviour ----------
      function phaseFor(a) {
        if (meetingUntil > clock) return "meeting";
        const m = (((clock + a.jitter) % 1440) + 1440) % 1440;
        if (m < 390) return "sleep";
        if (m < 480) return "breakfast";
        if (m < 720) return "work";
        if (m < 780) return "lunch";
        if (m < 1050) return "work";
        if (m < 1290) return "evening";
        return "sleep";
      }
      function say(a, text) {
        if (text) a.bubble = { text, t: 3.6 };
      }
      function pickSpot(dest, a, mode) {
        const p = places[dest];
        const taken = (s) => agents.some((o) => o !== a && Math.hypot(o.target?.x - s.x, o.target?.y - s.y) < 16);
        if (mode === "bed") return { x: p.x + 22, y: p.y + 68 };
        if (dest === "plaza" || dest === "pond") {
          for (let i = 0; i < 20; i++) {
            let s;
            if (dest === "plaza") {
              const ang = mode === "board" ? Math.PI * (0.25 + Math.random() * 0.5) : Math.random() * Math.PI * 2;
              const r = mode === "board" ? 28 + Math.random() * 6 : 38 + Math.random() * 16;
              s = { x: p.cx + Math.cos(ang) * r, y: p.cy + Math.sin(ang) * r };
            } else {
              const x = 130 + Math.random() * 280;
              s = { x, y: p.cy - p.ry * Math.sqrt(Math.max(0, 1 - ((x - p.cx) / p.rx) ** 2)) - 9 };
            }
            if (!taken(s)) return s;
          }
          return { x: p.cx ?? 300, y: p.cy };
        }
        const free = p.spots.filter((s) => !taken(s));
        return pick(free.length ? free : p.spots);
      }
      function goTo(a, dest, act, mode) {
        const spot = pickSpot(dest, a, mode);
        if (a.place === dest) a.path = [spot];
        else {
          const r = route("d_" + a.place, "d_" + dest);
          a.path = [r[0], ...r.slice(1), spot];
        }
        a.place = dest;
        a.target = spot;
        a.pending = act;
        a.act = null;
      }
      function arrive(a) {
        const act = a.pending; a.pending = null;
        a.act = { ...act, until: clock + (act.dur ?? Infinity) };
        if (act.onArrive) act.onArrive();
        if (act.say) say(a, act.say);
      }
      function decide(a) {
        const ph = a.phase;
        if (ph === "meeting") return goTo(a, "plaza", { kind: "meeting", label: "At the town meeting" });
        if (ph === "sleep") return goTo(a, a.home, { kind: "sleep", label: "Asleep", say: Math.random() < 0.5 ? pick(shared.sleep) : null }, "bed");
        if (ph === "breakfast" || ph === "lunch")

          }
          for (const [x, y] of lamps) {
            const g = ctx.createRadialGradient(x, y, 0, x, y, 40);
            g.addColorStop(0, `rgba(255,210,130,${dark * 0.9})`); g.addColorStop(1, "rgba(255,210,130,0)");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 40, 0, 7); ctx.fill();
          }
          const t = performance.now() / 1000;
          for (const f of flies) {
            const a = Math.max(0, Math.sin(t * 1.5 + f.p)) * dark * 1.6;
            ctx.fillStyle = `rgba(230,255,120,${a})`;
            ctx.beginPath(); ctx.arc(f.x + Math.sin(t * 0.7 + f.p) * 8, f.y + Math.cos(t * 0.5 + f.p) * 5, 1.8, 0, 7); ctx.fill();
          }
          ctx.globalCompositeOperation = "source-over";
          sorted.forEach(drawAgent);
        }
        sorted.forEach((a) => drawOverlayBits(a, dark));
      }

      // ---------- DOM ----------
      let selected = agents[0];
      const $ = (id) => document.getElementById(id);
      const nowLabel = (a) => a.path.length ? `Walking to ${places[a.place].name}` : a.act?.label || "Deciding what to do";
      function renderDom() {
        $("clock").textContent = `Day ${Math.floor(clock / 1440) + 1} · ${hhmm(clock)}`;
        const a = selected;
        $("profile").innerHTML = `
          <h2>Villager</h2>
          <div class="who"><span class="dot" style="background:${a.color}"></span><div><b>${esc(a.name)}</b><span>${esc(a.role)}</span></div></div>
          <p class="bio">${esc(a.bio)}</p>
          <dl>
            <dt>Now</dt><dd>${esc(nowLabel(a))}</dd>
            <dt>Task</dt><dd>${a.task ? esc(a.task.title) + ` <span style="color:var(--muted)">(${a.task.stage + 1}/${a.task.stages.length})</span>` : "—"}</dd>
            <dt>Shipped</dt><dd>${a.done} task${a.done === 1 ? "" : "s"}</dd>
            <dt>Lives in</dt><dd>${esc(places[a.home].name)}</dd>
          </dl>`;
        $("roster").innerHTML = agents.map((o, i) =>
          `<button data-i="${i}" class="${o === selected ? "on" : ""}"><span class="dot" style="background:${o.color}"></span>${esc(o.name)} <small>${esc(shortState(o))}</small></button>`).join("");
        const shown = [...tasks.filter((t) => t.status !== "done"), ...tasks.filter((t) => t.status === "done").sort((x, y) => y.doneAt - x.doneAt).slice(0, 3)];
        $("board").innerHTML = shown.length ? shown.map((t) => {
          const st = t.stages[Math.min(t.stage, t.stages.length - 1)];
          const prog = t.status === "done" ? 1 : (t.stage + (1 - st.left / st.dur)) / t.stages.length;
          const who = t.assignee ? `<span class="dot" style="background:${t.assignee.color};width:9px;height:9px"></span>${esc(t.assignee.name)}` : "Unclaimed";
          const stage = t.status === "done" ? "done" : t.status === "doing" ? esc(st.label.toLowerCase()) + " · " + esc(places[st.place].name) : t.kind;
          return `<li><div class="${t.status === "done" ? "done" : ""}">${t.mine ? '<span class="mine">Yours · </span>' : ""}${esc(t.title)}</div>
            <div class="meta">${who} · ${stage}</div>${t.status === "doing" ? `<div class="bar"><i style="width:${(prog * 100).toFixed(0)}%"></i></div>` : ""}</li>`;
        }).join("") : `<li style="color:var(--muted)">The board is empty. Post something!</li>`;
        if (dirty) {
          $("log").innerHTML = logs.map((l) => `<li><time>${l.t}</time>${esc(l.text)}</li>`).join("");
          dirty = false;
        }
      }
      function shortState(a) {
        if (a.path.length) return "walking";
        return { sleep: "asleep", meal: "eating", work: "working", claim: "at the board", idle: "idle", evening: "relaxing", meeting: "in a meeting" }[a.act?.kind] || "";
      }
      $("roster").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { selected = agents[+b.dataset.i]; renderDom(); } });
      cv.addEventListener("click", (e) => {
        const r = cv.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H;
        let best = null, bd = 22;
        for (const a of agents) { const d = Math.hypot(a.pos.x - x, a.pos.y - y); if (d < bd) { bd = d; best = a; } }
        if (best) { selected = best; say(best, pick(best.lines)); renderDom(); }
      });
      $("pause").addEventListener("click", () => { paused = !paused; $("pause").textContent = paused ? "Resume" : "Pause"; $("pause").classList.toggle("on", paused); });
      $("speed").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        speed = +b.dataset.s;
        [...$("speed").children].forEach((c) => c.classList.toggle("on", c === b));
      });
      $("bell").addEventListener("click", () => {
        if (meetingUntil > clock) return;
        meetingUntil = clock + 45;
        log("🔔 You rang the bell — town meeting in the square!");
        say(agents[0], "Everyone to the square!");
      });
      $("post").addEventListener("submit", (e) => {
        e.preventDefault();
        const text = $("postText").value.trim();
        if (!text) return;
        const t = addTask(text, classify(text), true);
        log(`📌 You posted “${t.title}” (${t.kind}).`);
        $("postText").value = "";
        renderDom();
      });

      // ---------- main loop ----------
      log("☀ Welcome to Agent Village. Breakfast is being served.");
      let last = performance.now(), domT = 0, prevHour = Math.floor(clock / 60);
      function frame(now) {
        const realDt = Math.min(0.1, (now - last) / 1000); last = now;
        if (!paused) {
          // Step in chunks so high speeds don't skip phase changes.
          let simDt = realDt * 6 * speed;
          while (simDt > 0) {
            const dt = Math.min(simDt, 2);
            clock += dt; simDt -= dt;
            agents.forEach((a) => update(a, dt, realDt * (dt / (realDt * 6 * speed))));
          }
          if (meetingUntil && clock >= meetingUntil) { meetingUntil = 0; log("Meeting adjourned. Back to it!"); }
          if (clock >= nextTaskAt) {
            const h = (clock % 1440) / 60;
            if (h >= 7 && h < 17 && tasks.filter((t) => t.status !== "done").length < 6) {
              const k = pick(kinds);
              const title = pick(titles[k]);
              if (!tasks.some((t) => t.title === title)) {
                addTask(title, k);
                log(`📋 New card on the board: “${title}”.`);
              }
            }
            nextTaskAt = clock + 50 + Math.random() * 70;
          }
          tasks = tasks.filter((t) => t.status !== "done" || clock - t.doneAt < 1440);
          const hour = Math.floor(clock / 60);
          if (hour !== prevHour) {
            if (hour % 24 === 6) log(`☀ Day ${Math.floor(clock / 1440) + 1} begins.`);
            if (hour % 24 === 22) log("🌙 The village goes to sleep.");
            prevHour = hour;
          }
        }
        draw();
        if ((domT += realDt) > 0.25) { domT = 0; renderDom(); }
        requestAnimationFrame(frame);
      }
      renderDom();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
